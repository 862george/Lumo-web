<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lumo</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Manrope:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0C0B;--card:#1A1614;--line:#3A332F;--red:#E5252A;--text:#fff;--muted:#C9C2BD}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;line-height:1.6}
a{color:inherit}
h1,h2,h3{font-family:'Unbounded',sans-serif;font-weight:600;line-height:1.15;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:24px 0}
.logo{font-family:'Unbounded',sans-serif;font-weight:600;font-size:24px;text-decoration:none}
.logo b{color:var(--red)}
.logo small{font-size:10px;letter-spacing:.5em;color:var(--red);margin-left:6px}
.secure{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
h1{font-size:clamp(24px,4.5vw,32px)}
.prep{margin:8px 0 0;color:var(--muted);font-weight:800}
.sum{margin:24px 0 0}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.row dt{color:var(--muted)}
.row dt span{font-size:13px}
.row dd{margin:0;font-weight:800;text-align:right;white-space:nowrap}
.row.total{border-bottom:0;font-size:20px}
.row.total dt{color:var(--text);font-weight:800}
.was{color:var(--muted);font-weight:500;margin-right:6px}
.then{margin:6px 0 0;padding:16px;border-radius:16px;background:rgba(229,37,42,.1);border:1px solid rgba(229,37,42,.5);color:var(--muted);font-size:15px}
.then b{color:#fff;font-family:'Unbounded',sans-serif;font-size:16px;display:block;margin-bottom:2px}
ul.inc{padding:0;margin:20px 0 0;list-style:none;display:grid;gap:8px;color:var(--muted);font-size:15px}
ul.inc li{display:flex;gap:10px}
ul.inc svg{flex:0 0 18px;margin-top:3px}
.prio{display:flex;gap:12px;align-items:flex-start;background:rgba(229,37,42,.12);border:1px solid var(--red);border-radius:16px;padding:14px 16px;margin:20px 0 0;font-weight:800;font-size:15px;line-height:1.4}
.prio svg{flex:0 0 22px;margin-top:2px}
.prio span{display:block;color:var(--muted);font-weight:500;font-size:14px;margin-top:2px}
.terms{display:flex;gap:12px;align-items:flex-start;margin:26px 0 0;font-size:14px;color:var(--muted)}
.terms input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--red);margin:2px 0 0}
.terms a{color:#fff}
.btn{display:block;width:100%;background:var(--red);color:#fff;text-align:center;font:800 17px 'Manrope',sans-serif;padding:17px 24px;border-radius:999px;border:0;cursor:pointer;margin-top:18px}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:transparent;border:2px solid var(--line);color:#fff;margin-top:12px}
.btn.alt:hover:not(:disabled){border-color:var(--red);filter:none}
.btn:focus-visible,.terms input:focus-visible{outline:2px solid #fff;outline-offset:3px}
.methods{margin:12px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.hint{margin:10px 0 0;text-align:center;font-size:13px;color:#FF8A8D;font-weight:800}
.notice{margin:16px 0 0;padding:12px 16px;border-radius:12px;background:rgba(255,138,141,.1);border:1px solid #FF8A8D;font-size:14px;color:#FFC9CA}
.trust{margin:20px 0 0;font-size:13px;color:var(--muted);text-align:center}
.help{margin:6px 0 0;font-size:13px;color:var(--muted);text-align:center}
footer{padding:36px 0 48px;text-align:center;font-size:13px;color:#8A817B}
footer a{text-decoration:none;font-weight:800;color:var(--muted);margin:0 10px}
footer a:hover{color:#fff}
.one{max-width:560px;margin:8px auto 0}
</style>
</head>
<body>
<div class="wrap"><div class="top"><a class="logo" href="/">lum<b>o</b><small>WEB</small></a><span class="secure">Secure checkout</span></div></div><main class="wrap"><div class="one card" style="text-align:center">
<h1 id="h">Checking your payment...</h1>
<p class="then" id="m" style="text-align:left">One moment.</p>
<p class="help">Questions? <a href="mailto:contact@lumoweb.uk">contact@lumoweb.uk</a></p>
</div></main>
<footer><a href="/privacy.html">Privacy Policy</a><a href="/terms.html">Terms of Service</a><a href="mailto:contact@lumoweb.uk">contact@lumoweb.uk</a><div style="margin-top:10px">© 2026 Lumo Web</div></footer>
<script>
(function(){
const h=document.getElementById("h"),m=document.getElementById("m");
const id=new URLSearchParams(location.search).get("session_id")||"";
function say(a,b){h.textContent=a;m.textContent=b;}
if(!id){say("Nothing to show","This page is shown after a payment. If you have a question, email contact@lumoweb.uk.");return;}
fetch("/api/session-status?session_id="+encodeURIComponent(id)).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
if(d.status==="complete"){say("Thank you, payment received","We’ll email you at "+(d.email||"your email address")+" to confirm the next steps. A receipt from Stripe is on its way too.");}
else{say("Payment not completed","It looks like the payment didn’t go through. Please go back to your payment link and try again, or email contact@lumoweb.uk.");}
}).catch(()=>say("We couldn’t check your payment","If you were charged, don’t worry: we’ll see it on our side. Email contact@lumoweb.uk and we’ll confirm."));
})();
</script>
</body>
</html>
