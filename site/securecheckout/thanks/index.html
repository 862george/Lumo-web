<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | SynthPage</title>
<meta name="description" content="Payment confirmation.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://synthpage.co.uk/securecheckout/thanks/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/display-bold.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/fonts/body-regular.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/css/site.css">
<script>document.documentElement.className+=" js"</script>
</head>
<body>
<header class="nav" id="nav"><a class="brand" href="/" aria-label="SynthPage home"><img src="/images/logo.svg" alt="SynthPage" width="170" height="34"></a><span class="secure"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>Secure checkout</span></header>
<main class="co"><div class="panel" style="text-align:center"><h1 id="h">Checking your payment...</h1>
<p class="then" id="m" style="text-align:left;margin-top:20px">One moment.</p>
<p class="help">Questions? <a href="mailto:contact@synthpage.co.uk">contact@synthpage.co.uk</a></p></div></main>
<footer style="padding:28px 0"><div class="wrap"><nav class="fnav" style="justify-content:center" aria-label="Footer"><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Service</a><a href="mailto:contact@synthpage.co.uk">contact@synthpage.co.uk</a></nav><p class="fine" style="text-align:center;margin:12px 0 0">© 2026 SynthPage</p></div></footer>
<script>
(function(){
const h=document.getElementById("h"),m=document.getElementById("m");
const id=new URLSearchParams(location.search).get("session_id")||"";
function say(a,b){h.textContent=a;m.textContent=b;}
if(!id){say("Nothing to show","This page is shown after a payment. If you have a question, email contact@synthpage.co.uk.");return;}
fetch("/api/session-status?session_id="+encodeURIComponent(id)).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
if(d.status==="complete"){say("Thank you, payment received","We’ll email you at "+(d.email||"your email address")+" to confirm the next steps. A receipt from Stripe is on its way too.");}
else{say("Payment not completed","It looks like the payment didn’t go through. Please go back to your payment link and try again, or email contact@synthpage.co.uk.");}
}).catch(()=>say("We couldn’t check your payment","If you were charged, don’t worry: we’ll see it on our side. Email contact@synthpage.co.uk and we’ll confirm."));
})();
</script>
</body>
</html>
